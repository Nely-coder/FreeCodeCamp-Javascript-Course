<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Palindrome Checker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <h1>Palindrome Checker</h1>
    <main>
      <div role="input-container" class="input-container">
        <label for="text-input">Enter in text to check: </label>
        <input id="text-input" type="text" />
        <button id="check-btn">Check</button>
        <div id="result"></div>
      </div>

      <div class="info-block" role="info-block">
        <p>
          💡A <i>palindrome</i> is a word or phrase that can be read the same
          way forwards and backwards, ignoring punctuation, case, and spacing.
        </p>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
